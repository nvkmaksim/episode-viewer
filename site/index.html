<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Просмотр разметки</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header>
    <h1 id="title">Просмотр разметки</h1>
    <span class="note">Только просмотр. Часть разметки получена моделями (позы, глубина, камера) и не является измерением.</span>
  </header>
  <div id="loading">Загрузка разметки…</div>
  <main id="app" hidden>
    <section id="player">
      <div id="stage">
        <video id="video" playsinline preload="auto"></video>
        <canvas id="overlay"></canvas>
        <div id="layers">
          <button id="layers-button" type="button"></button>
          <div id="layers-panel" hidden></div>
        </div>
        <div id="subs" hidden></div>
        <div id="video-error" hidden></div>
      </div>
      <div id="controls">
        <button id="play" type="button" title="Пробел">▶</button>
        <span id="time">0:00 / 0:00</span>
        <span id="frame"></span>
        <label>Скорость
          <select id="speed"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option></select>
        </label>
        <span class="hint">Пробел — пауза, ← → — ±1 с, , . — кадр</span>
      </div>
      <canvas id="timeline"></canvas>
      <div id="timeline-tip" hidden></div>
    </section>
    <aside id="side">
      <nav id="tabs">
        <button type="button" data-tab="actions" class="active">Действия</button>
        <button type="button" data-tab="scene3d">Сцена 3D</button>
        <button type="button" data-tab="info">О разметке</button>
      </nav>
      <div id="tab-actions" class="tab"></div>
      <div id="tab-scene3d" class="tab" hidden></div>
      <div id="tab-info" class="tab" hidden></div>
    </aside>
  </main>
  <script src="viewer.js"></script>
</body>
</html>
